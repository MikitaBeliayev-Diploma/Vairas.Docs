  /internal/v1/groups/{groupId}/participants:
    get:
      operationId: getGroupParticipants
      summary: Resolve enrolled students to be reserved for a theory lesson
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: schoolId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        example: synthetic-X-Correlation-ID
      - name: membershipRevision
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        example: 1
        description: Exact historical group membership revision from the Scheduling source. Omit only when explicitly
          requesting current membership.
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2026-12-01T10:00:00Z'
        description: Bound of the requested lesson interval. Require an increasing interval and verify complete
          membership coverage at the selected revision.
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
        example: '2026-12-01T11:00:00Z'
        description: Bound of the requested lesson interval. Require an increasing interval and verify complete
          membership coverage at the selected revision.
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupParticipants'
              examples:
                typical:
                  summary: Result
                  value:
                    groupId: 11111111-1111-4111-8111-111111111111
                    schoolId: 11111111-1111-4111-8111-111111111111
                    membershipVersion: 3
                    participants:
                    - enrollmentId: 11111111-1111-4111-8111-111111111111
                      studentId: 11111111-1111-4111-8111-111111111111
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                typical:
                  summary: Invalid input
