components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token; dedicated audience and workload scope.
    workloadOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:7100/connect/token
          scopes:
            identity.validate: Validate current user identity and session
            school.profile-provisioning: Validate invitation or bootstrap evidence
            confirmations.validate: Validate exact human approval
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
    EnrollmentEligibility:
      type: object
      required:
      - enrollmentId
      - schoolId
      - studentId
      - active
      - category
      - version
      - teacherAllowed
      properties:
        enrollmentId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        active:
          type: boolean
        category:
          type: string
        version:
          type: integer
          minimum: 1
        teacherAllowed:
          type: boolean
      description: Enrollment Eligibility. See the operation descriptions for authorization and lifecycle constraints.
    GroupParticipants:
      type: object
      required:
      - groupId
      - schoolId
      - participants
      - membershipVersion
      properties:
        groupId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        membershipVersion:
          type: integer
          minimum: 1
        participants:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - enrollmentId
            - studentId
            properties:
              enrollmentId:
                type: string
                format: uuid
              studentId:
                type: string
                format: uuid
      description: Complete verified enrollment/student pairs at exactly membershipVersion. No duplicate enrollment;
        school, group and historical membership must be owner-verified.
    CreateEnrollment:
      type: object
      required:
      - studentId
      - licenseCategory
      properties:
        studentId:
          type: string
          format: uuid
        licenseCategory:
          type: string
      description: Create Enrollment. See the operation descriptions for authorization and lifecycle constraints.
    Enrollment:
      type: object
      required:
      - enrollmentId
      - schoolId
      - studentId
      - status
      - version
      properties:
        enrollmentId:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Active
          - Completed
          - Withdrawn
          - Transferred
          - Cancelled
        version:
          type: integer
          minimum: 1
          description: Current enrollment revision; use as expectedRevision for an enrollment change.
      description: Enrollment. See the operation descriptions for authorization and lifecycle constraints.
    MembershipList:
      type: array
      items:
        type: object
        required:
        - userId
        - role
        properties:
          userId:
            type: string
            format: uuid
          role:
            type: string
            enum:
            - Student
            - Teacher
            - Administrator
      description: Membership List. See the operation descriptions for authorization and lifecycle constraints.
    Id:
      type: string
      format: uuid
      description: Id. See the operation descriptions for authorization and lifecycle constraints.
    NullableId:
      type:
      - string
      - 'null'
      format: uuid
      description: Nullable Id. See the operation descriptions for authorization and lifecycle constraints.
    SchoolAuthorityRequest:
      type: object
      required:
      - actorUserId
      - targetUserId
      - schoolId
      - invitationId
      - role
      - bootstrap
      properties:
        actorUserId:
          $ref: '#/components/schemas/Id'
        targetUserId:
          $ref: '#/components/schemas/Id'
        schoolId:
          $ref: '#/components/schemas/Id'
        invitationId:
          $ref: '#/components/schemas/NullableId'
        role:
          type: string
          enum:
          - Teacher
          - Administrator
        bootstrap:
          type: boolean
      description: School Authority Request. See the operation descriptions for authorization and lifecycle constraints.
    ConfirmationRequest:
      type: object
      required:
      - confirmationId
      - identityId
      - operationId
      - requestFingerprint
      - schoolId
      - commandName
      properties:
        confirmationId:
          $ref: '#/components/schemas/Id'
        identityId:
          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        requestFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        schoolId:
          $ref: '#/components/schemas/NullableId'
        commandName:
          type: string
          enum:
          - CreateUser
          - UpdateUser
          - CreateStudent
          - CreateTeacher
          - CreateAdministrator
      description: Confirmation Request. See the operation descriptions for authorization and lifecycle constraints.
    EnrollmentList:
      type: array
      items:
        $ref: '#/components/schemas/Enrollment'
      description: Enrollment List. See the operation descriptions for authorization and lifecycle constraints.
    GroupAssignment:
      type: object
      required:
      - groupId
      - programVersionId
      - expectedRevision
      properties:
        groupId: &id001
          type: string
          format: uuid
        programVersionId: *id001
        expectedRevision:
          type: integer
          minimum: 1
          description: Current enrollment version, not the group membership snapshot revision. Recheck roster/program
            applicability and coordination separately.
      description: Group Assignment. See the operation descriptions for authorization and lifecycle constraints.
    PlanningInputs:
      type: object
      required:
      - schoolId
      - complete
      - missingItems
      properties:
        schoolId:
          type: string
          format: uuid
        complete:
          type: boolean
        missingItems:
          type: array
          items:
            type: string
      description: Planning Inputs. See the operation descriptions for authorization and lifecycle constraints.
