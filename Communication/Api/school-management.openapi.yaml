      security:
      - workloadBearer: []
      x-status: proposed
      description: Require a permitted workload and exact school/group scope. Without membershipRevision, return
        the current complete enrollment/student roster and its membershipVersion. With membershipRevision, return
        exactly that retained historical revision or fail closed if it cannot be verified; never substitute the
        current roster. This supports the immutable as-of roster used for theory confirmation and does not prove
        future reservation eligibility. Filter the retained membership periods for the exact required from/to lesson
        interval and return only verified full-interval participants. For Learning confirmation, verify the same
        retained participant basis as the lesson source; reconcile physical-time deviations and any membership mismatch
        before credit.
      tags:
      - school-management
    parameters: []
