      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        example: synthetic-X-Correlation-ID
      - name: teacherId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
