openapi: 3.1.0
info:
  title: Vairas Vehicle Management API — Planned Vehicle State Change Saga
  version: 0.2.0
  description: 'PROPOSED contract, not an implemented API. Vehicle Management owns vehicle

    status and coordinates planned StartMaintenance, Deactivate, and Reactivate

    operations with Scheduling. Planned changes run asynchronously.

    Emergency vehicle failures are deliberately outside this contract.

    '
tags:
- name: Vehicle Operations
- name: Vehicle Eligibility
security:
- bearerAuth: []
paths:
  /api/v1/vehicles/{vehicleId}/state-change-operations:
    parameters:
    - name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Vehicle Operations
      operationId: requestVehicleStateChange
      summary: Initiate a durable vehicle state-change Saga
      description: 'Writes the Saga request with a unique Idempotency-Key, then schedules the

        orchestrator. Does NOT claim the state change has completed. StartMaintenance

        must reference an existing scheduled Maintenance aggregate. For planned

        availability reduction Scheduling must block bookings before Vehicle status

        changes. An equivalent retry returns the same operation (202 if unfinished,

        200 if terminal); reusing the same key with a different request returns 409.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique per user/tenant/command intent; server binds key to request hash.
        schema:
          type: string
          minLength: 8
          maxLength: 128
        example: synthetic-Idempotency-Key
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        example: synthetic-X-Correlation-ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateChangeRequest'
            examples:
              typical:
                summary: Synthetic permitted request; credentials are environment placeholders.
                value:
                  operationType: StartMaintenance
                  maintenanceId: 11111111-1111-4111-8111-111111111111
      responses:
        '202':
          description: Accepted; operation is pending/in progress, not yet committed.
          headers:
            Location:
              description: Relative URI of the operation status resource.
              schema:
                type: string
            Retry-After:
              description: Suggested number of seconds until status polling.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateChangeOperation'
              examples:
                typical:
                  summary: Accepted; operation is pending/in progress, not yet committed.
                  value:
                    operationId: 11111111-1111-4111-8111-111111111111
                    vehicleId: 11111111-1111-4111-8111-111111111111
                    operationType: StartMaintenance
                    status: Pending
                    createdAt: '2026-12-01T10:00:00Z'
                    updatedAt: '2026-12-01T10:00:00Z'
        '200':
          description: Idempotent replay of a terminal operation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateChangeOperation'
              examples:
                typical:
                  summary: Idempotent replay of a terminal operation result.
                  value:
                    operationId: 11111111-1111-4111-8111-111111111111
                    vehicleId: 11111111-1111-4111-8111-111111111111
                    operationType: StartMaintenance
                    status: Pending
                    createdAt: '2026-12-01T10:00:00Z'
                    updatedAt: '2026-12-01T10:00:00Z'
        '400':
          description: Malformed request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Malformed request.
                status: 400
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '401':
          description: Missing/invalid token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Missing/invalid token.
                status: 401
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '403':
          description: Insufficient permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Insufficient permission.
                status: 403
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '404':
          description: Not found or intentionally concealed resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Not found or intentionally concealed resource.
                status: 404
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '409':
          description: Competing in-progress operation, idempotency mismatch, or state conflict.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Competing in-progress operation, idempotency mismatch, or state conflict.
                status: 409
                code: RESOURCE_CONFLICT
                correlationId: integration-example-01
        '422':
          description: Business-state validation failure, e.g. maintenance is not scheduled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Business-state validation failure, e.g. maintenance is not scheduled.
                status: 422
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '429':
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Too many requests.
                status: 429
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '503':
          description: Temporarily unable to process request; query status before assuming rollback.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Temporarily unable to process request; query status before assuming rollback.
                status: 503
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
      x-status: proposed
      x-negative-request:
        description: 'Missing required operationType: reject with 400 before business work.'
        mediaType: application/json
        value:
          maintenanceId: 11111111-1111-4111-8111-111111111111
        expectedStatus: 400
  /api/v1/vehicles/{vehicleId}/state-change-operations/{operationId}:
    parameters:
    - name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Vehicle Operations
      operationId: getVehicleStateChangeOperation
      summary: Get the authoritative Saga state
      description: 'Used by the UI after 202, disconnects, and timeouts. The response never

        includes another tenant''s lesson IDs or student details.

        '
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        example: synthetic-X-Correlation-ID
      responses:
        '200':
          description: Current persisted operation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateChangeOperation'
              examples:
                typical:
                  summary: Current persisted operation state.
                  value:
                    operationId: 11111111-1111-4111-8111-111111111111
                    vehicleId: 11111111-1111-4111-8111-111111111111
                    operationType: StartMaintenance
                    status: Pending
                    createdAt: '2026-12-01T10:00:00Z'
                    updatedAt: '2026-12-01T10:00:00Z'
        '401':
          description: Missing/invalid token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Missing/invalid token.
                status: 401
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '403':
          description: Insufficient permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Insufficient permission.
                status: 403
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '404':
          description: Not found or intentionally concealed resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Not found or intentionally concealed resource.
                status: 404
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '429':
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Too many requests.
                status: 429
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '503':
          description: Temporarily unable to process request; query status before assuming rollback.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Temporarily unable to process request; query status before assuming rollback.
                status: 503
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
      x-status: proposed
  /internal/v1/vehicles/{vehicleId}/eligibility:
    parameters:
    - name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Vehicle Eligibility
      operationId: getVehicleEligibility
      summary: Query operational suitability; NOT a booking reservation
      description: 'Checks vehicle''s current status, category, assigned teacher and branch.

        This preflight result does not reserve a vehicle and is insufficient by

        itself to prevent races with later state changes. Scheduling must still

        enforce its booking gate transaction.

        '
      security:
      - workloadBearer: []
      parameters:
      - name: branchId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: teacherId
        in: query
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      - name: category
        in: query
        required: true
        schema:
          type: string
          minLength: 1
        example: B
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        example: synthetic-X-Correlation-ID
      responses:
        '200':
          description: Suitability result (includes eligible=false; do not use 409 here).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleEligibility'
              examples:
                typical:
                  summary: Suitability result (includes eligible=false; do not use 409 here).
                  value:
                    vehicleId: 11111111-1111-4111-8111-111111111111
                    eligible: true
                    vehicleStatus: Active
                    vehicleVersion: 1
        '400':
          description: Malformed request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Malformed request.
                status: 400
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '401':
          description: Missing/invalid token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Missing/invalid token.
                status: 401
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '403':
          description: Insufficient permission.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Insufficient permission.
                status: 403
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '404':
          description: Not found or intentionally concealed resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Not found or intentionally concealed resource.
                status: 404
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
        '503':
          description: Temporarily unable to process request; query status before assuming rollback.
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: LessonScheduled
                title: Temporarily unable to process request; query status before assuming rollback.
                status: 503
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
      x-status: proposed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: End-user delegated token; tenant and resource authorization remains server-side.
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service scoped token with appropriate audience and workload identity.
  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per user/tenant/command intent; server binds key to request hash.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
  schemas:
    StateChangeRequest:
      type: object
      additionalProperties: false
      required:
      - operationType
      properties:
        operationType:
          type: string
          enum:
          - StartMaintenance
          - Deactivate
          - Reactivate
        maintenanceId:
          type: string
          format: uuid
          description: Required for StartMaintenance; prohibited for other operations.
      allOf:
      - if:
          properties:
            operationType:
              const: StartMaintenance
          required:
          - operationType
        then:
          required:
          - maintenanceId
        else:
          not:
            required:
            - maintenanceId
      description: State Change Request. See the operation descriptions for authorization and lifecycle constraints.
    StateChangeOperation:
      type: object
      additionalProperties: false
      required:
      - operationId
      - vehicleId
      - operationType
      - status
      - createdAt
      - updatedAt
      properties:
        operationId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        operationType:
          type: string
          enum:
          - StartMaintenance
          - Deactivate
          - Reactivate
        status:
          type: string
          enum:
          - Pending
          - Blocking
          - SchedulingBlocked
          - ApplyingVehicleState
          - ReleasingBlock
          - Completed
          - Rejected
          - NeedsRecovery
        blockId:
          type: string
          format: uuid
        resultVehicleStatus:
          type: string
          enum:
          - Active
          - Inactive
          - UnderMaintenance
        errorCode:
          type: string
          description: Stable, non-sensitive machine-readable result code on rejection/recovery.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      description: State Change Operation. See the operation descriptions for authorization and lifecycle constraints.
    VehicleEligibility:
      type: object
      additionalProperties: false
      required:
      - vehicleId
      - eligible
      - vehicleStatus
      - vehicleVersion
      properties:
        vehicleId:
          type: string
          format: uuid
        eligible:
          type: boolean
        vehicleStatus:
          type: string
          enum:
          - Active
          - Inactive
          - UnderMaintenance
        vehicleVersion:
          type: integer
          minimum: 0
        reasons:
          type: array
          items:
            type: string
            enum:
            - STATUS_NOT_ACTIVE
            - CATEGORY_NOT_SUPPORTED
            - TEACHER_NOT_ASSIGNED
            - BRANCH_MISMATCH
      description: Vehicle Eligibility. See the operation descriptions for authorization and lifecycle constraints.
    Problem:
      type: object
      additionalProperties: true
      required:
      - type
      - title
      - status
      - code
      - correlationId
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
        detail:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing/invalid token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Insufficient permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found or intentionally concealed resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Competing in-progress operation, idempotency mismatch, or state conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Business-state validation failure, e.g. maintenance is not scheduled.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Too many requests.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Temporarily unable to process request; query status before assuming rollback.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
