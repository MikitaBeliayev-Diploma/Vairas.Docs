components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token; dedicated audience and workload scope.
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
    GenerateContract:
      type: object
      required:
      - enrollmentId
      - templateId
      properties:
        enrollmentId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
      description: Owner resolves templateId to an authorized applicable immutable template version and pins it
        with the generated evidence. A template identifier is not a version.
    GenerateJournal:
      type: object
      required:
      - sourceSnapshotVersion
      properties:
        sourceSnapshotVersion:
          type: string
      description: Generate Journal. See the operation descriptions for authorization and lifecycle constraints.
    DocumentJob:
      type: object
      required:
      - jobId
      - status
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Pending
          - Generating
          - Completed
          - Failed
        documentId:
          type: string
          format: uuid
        ready:
          type: boolean
        missingItems:
          type: array
          items:
            type: string
        sourceSnapshotVersion:
          type: string
        documentState:
          type: string
          enum:
          - Prepared
          - Indeterminate
          - PublishedReview
          - PublishedReady
          - Stale
          - Withdrawn
          description: Document lifecycle from the owner schema, independent of generation job status.
      description: Completed means generation finished; it does not imply legally valid signature, release readiness
        or Regitra submission. Missing facts/confirmations must be visible. Historical output remains immutable
        after source revision.
    CompletionReportRequest:
      type: object
      required:
      - sourceSnapshotVersion
      properties:
        sourceSnapshotVersion:
          type: string
      description: Completion Report Request. See the operation descriptions for authorization and lifecycle constraints.
    DocumentDownload:
      type: object
      required:
      - documentId
      - downloadUrl
      - expiresAt
      properties:
        documentId:
          type: string
          format: uuid
        downloadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      description: Document Download. See the operation descriptions for authorization and lifecycle constraints.
