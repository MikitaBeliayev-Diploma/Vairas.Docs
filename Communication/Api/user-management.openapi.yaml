  /api/v1/users/me:
    get:
      tags:
      - Profiles
      summary: Read the current user's global profile and role bindings.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserProfileResult'
              examples:
                typical:
                  summary: OK
                  value:
                    userId: 11111111-1111-4111-8111-111111111111
                    firstName: Alex
                    lastName: Example
                    emailAddress: alex@example.test
                    phoneNumber: '+37060000000'
                    status: Active
                    revision: 1
                    createdAt: '2026-12-01T10:00:00Z'
                    updatedAt: '2026-12-01T10:00:00Z'
                    studentId: 11111111-1111-4111-8111-111111111111
                    teacherId: 11111111-1111-4111-8111-111111111111
                    administratorId: 11111111-1111-4111-8111-111111111111
