      - InternalProfiles
      summary: Read operational status using a permitted workload identity.
      description: ' Required workload scope and local client allowlist: profiles.status.read. See ../guides/security.md
        and ../guides/errors-and-reliability.md for current authorization and retry behavior.'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 11111111-1111-4111-8111-111111111111
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
              examples:
                typical:
                  summary: OK
                  value:
                    userId: 11111111-1111-4111-8111-111111111111
                    active: true
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
              examples:
                typical:
                  summary: OK
                  value:
                    userId: 11111111-1111-4111-8111-111111111111
                    active: true
            text/json:
              schema:
                $ref: '#/components/schemas/UserStatusResponse'
              examples:
                typical:
                  summary: OK
                  value:
                    userId: 11111111-1111-4111-8111-111111111111
                    active: true
        '400':
          description: Problem Details with code and correlationId.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ApiProblem'
              examples:
                typical:
                  summary: Problem Details with code and correlationId.
                  value:
                    title: Problem Details with code and correlationId.
                    status: 400
                    code: VALIDATION_FAILED
                    correlationId: integration-example-01
        '401':
