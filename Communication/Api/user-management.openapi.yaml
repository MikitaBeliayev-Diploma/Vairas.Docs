openapi: 3.1.1
info:
  title: Vairas User Management API
  description: Global profiles and idempotent commands. Internal operations require a workload JWT. Delegated and
    platform mutations additionally require a user JWT in X-User-Authorization. Mutations return operation receipts;
    fetch current resource state separately.
  version: 1.0.0
servers:
- url: http://localhost:5151
  description: Loopback development launch profile; use HTTPS outside local development.
paths:
  /internal/v1/users/{userId}/status:
    get:
