components:
  schemas:
    ApiProblem:
      required:
      - title
      - status
      - code
      - correlationId
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
        type:
          type: string
          format: uri-reference
        instance:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        operation:
          $ref: '#/components/schemas/OperationReceipt'
      description: Api Problem. See the operation descriptions for authorization and lifecycle constraints.
    BootstrapRequest:
      required:
      - schoolId
      type: object
      properties:
        schoolId:
          type: string
          format: uuid
      description: School-authorized bootstrap of the first administrator.
      additionalProperties: false
    DeactivateRequest:
      required:
      - expectedRevision
      type: object
      properties:
        expectedRevision:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int64
        reason:
          type:
          - 'null'
          - string
          maxLength: 1000
      description: Global deactivation of a user at a specific revision.
      additionalProperties: false
    OperationOutcome:
      type: string
      enum:
      - Applied
      - Rejected
      description: Canonical response names from JsonStringEnumConverter. The default converter also accepts defined
        integer enum input values; these models are responses.
    OperationReceipt:
      required:
      - operationId
      - outcome
      - code
      - targetKind
      - targetId
      - resultingRevision
      - recordedAt
      type: object
      properties:
        operationId:
          type: string
          format: uuid
        outcome:
          $ref: '#/components/schemas/OperationOutcome'
        code:
          type: string
        targetKind:
          type: string
        targetId:
          type: string
          format: uuid
        resultingRevision:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int64
        recordedAt:
          type: string
          format: date-time
      description: Operation Receipt. See the operation descriptions for authorization and lifecycle constraints.
    ProfileKind:
      type: string
      enum:
      - Student
      - Teacher
      - Administrator
      description: Canonical response names from JsonStringEnumConverter. The default converter also accepts defined
        integer enum input values; these models are responses.
    ProfileRequest:
      required:
      - firstName
      - lastName
      - emailAddress
      - phoneNumber
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: Required non-whitespace personal name; original value is retained in the command fingerprint.
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: Required non-whitespace personal name; original value is retained in the command fingerprint.
        emailAddress:
          type:
          - 'null'
          - string
          maxLength: 254
          description: Contact email or null; non-null values must pass FluentValidation EmailAddress. Not an authentication
            identity.
        phoneNumber:
          type:
          - 'null'
          - string
          maxLength: 32
          description: Non-whitespace contact number or null.
        expectedRevision:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - 'null'
          - integer
          - string
          format: int64
        confirmationId:
          type:
          - 'null'
          - string
          format: uuid
      description: Personal information for creating or replacing the authenticated profile.
      additionalProperties: false
    RoleProfileResult:
      required:
      - kind
      - profileId
      - userId
      - active
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/ProfileKind'
        profileId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        active:
          type: boolean
      description: Role Profile Result. See the operation descriptions for authorization and lifecycle constraints.
    RoleRequest:
      type: object
      properties:
        schoolId:
          type:
          - 'null'
          - string
          format: uuid
        invitationId:
          type:
          - 'null'
          - string
          format: uuid
        confirmationId:
          type:
          - 'null'
          - string
          format: uuid
      description: Role provisioning arguments; school and invitation are mandatory for staff roles.
      additionalProperties: false
    UserContactResponse:
      required:
      - userId
      - email
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type:
          - 'null'
          - string
      description: Minimal contact details; a contact address can be absent.
    UserProfileResult:
      required:
      - userId
      - firstName
      - lastName
      - emailAddress
      - phoneNumber
      - status
      - revision
      - createdAt
      - updatedAt
      - studentId
      - teacherId
      - administratorId
      type: object
      properties:
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type:
          - 'null'
          - string
        phoneNumber:
          type:
          - 'null'
          - string
        status:
          $ref: '#/components/schemas/UserStatus'
        revision:
          pattern: ^-?(?:0|[1-9]\d*)$
          type:
          - integer
          - string
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        studentId:
          type:
          - 'null'
          - string
          format: uuid
        teacherId:
          type:
          - 'null'
          - string
          format: uuid
        administratorId:
          type:
          - 'null'
          - string
          format: uuid
      description: User Profile Result. See the operation descriptions for authorization and lifecycle constraints.
    UserStatus:
      type: string
      enum:
      - Active
      - Inactive
      description: Canonical response names from JsonStringEnumConverter. The default converter also accepts defined
        integer enum input values; these models are responses.
    UserStatusResponse:
      required:
      - userId
      - active
      type: object
      properties:
        userId:
          type: string
          format: uuid
        active:
          type: boolean
      description: Authoritative global operational status.
  securitySchemes:
    UserBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    WorkloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DelegatedUser:
      type: apiKey
      description: Bearer <user JWT>, validated independently of the workload token.
      name: X-User-Authorization
      in: header
