openapi: 3.1.1
info:
  title: Vairas Scheduling API
  description: School-scoped scheduling, atomic reservations, physical lifecycle and durable owner coordination.
    Learning credit and vehicle lifecycle belong to their owners.
  version: 1.0.0
servers:
- url: https://localhost:7300/
