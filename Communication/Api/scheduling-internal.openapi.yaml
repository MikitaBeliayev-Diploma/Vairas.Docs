        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonAction'
          text/json:
            schema:
              $ref: '#/components/schemas/LessonAction'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LessonAction'
        required: true
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/LessonActionReceipt'
            application/json:
              schema:
                $ref: '#/components/schemas/LessonActionReceipt'
            text/json:
              schema:
                $ref: '#/components/schemas/LessonActionReceipt'
        '400':
          description: ProblemDetails with stable code and correlationId; another school's state is never disclosed.
        '401':
          description: ProblemDetails with stable code and correlationId; another school's state is never disclosed.
        '403':
          description: ProblemDetails with stable code and correlationId; another school's state is never disclosed.
        '404':
