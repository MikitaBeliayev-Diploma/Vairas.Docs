  /api/v1/auth/oidc/requests:
    post:
      operationId: beginOidc
      summary: Start allowlisted OIDC login or authenticated explicit linking
      description: Start allowlisted external OIDC login or explicit linking. Login may be anonymous. Link requires
        a currently authenticated active identity/session, server-bound to the stored request; reject anonymous
