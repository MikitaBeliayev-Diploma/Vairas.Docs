components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:7100/connect/token
          scopes:
            identity.validate: Validate current user identity and session
            school.profile-provisioning: Validate invitation or bootstrap evidence
            confirmations.validate: Validate exact human approval
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
    Id:
      type: string
      format: uuid
      description: Id. See the operation descriptions for authorization and lifecycle constraints.
    NullableId:
      type:
      - string
      - 'null'
      format: uuid
      description: Nullable Id. See the operation descriptions for authorization and lifecycle constraints.
    SchoolAuthorityRequest:
      type: object
      required:
      - actorUserId
      - targetUserId
      - schoolId
      - invitationId
      - role
      - bootstrap
      properties:
        actorUserId:
          $ref: '#/components/schemas/Id'
        targetUserId:
          $ref: '#/components/schemas/Id'
        schoolId:
          $ref: '#/components/schemas/Id'
        invitationId:
          $ref: '#/components/schemas/NullableId'
        role:
          type: string
          enum:
          - Teacher
          - Administrator
        bootstrap:
          type: boolean
      description: School Authority Request. See the operation descriptions for authorization and lifecycle constraints.
    ConfirmationRequest:
      type: object
      required:
      - confirmationId
      - identityId
      - operationId
      - requestFingerprint
      - schoolId
      - commandName
      properties:
        confirmationId:
          $ref: '#/components/schemas/Id'
        identityId:
          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        requestFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        schoolId:
          $ref: '#/components/schemas/NullableId'
        commandName:
          type: string
          enum:
          - CreateUser
          - UpdateUser
          - CreateStudent
          - CreateTeacher
          - CreateAdministrator
      description: Confirmation Request. See the operation descriptions for authorization and lifecycle constraints.
    Registration:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          writeOnly: true
      description: Registration. See the operation descriptions for authorization and lifecycle constraints.
    Login:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      description: Login. See the operation descriptions for authorization and lifecycle constraints.
    TokenPair:
      type: object
      required:
      - accessToken
      - refreshToken
      - tokenType
      - expiresIn
      - identityId
      - sessionId
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
        identityId: &id001
          type: string
          format: uuid
        sessionId: *id001
      description: Token Pair. See the operation descriptions for authorization and lifecycle constraints.
    Refresh:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          writeOnly: true
      description: Refresh. See the operation descriptions for authorization and lifecycle constraints.
    Accepted:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      description: Accepted. See the operation descriptions for authorization and lifecycle constraints.
    ChallengeRequest:
      type: object
      required:
      - email
      - purpose
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum:
          - VerifyEmail
          - ResetPassword
      description: Challenge Request. See the operation descriptions for authorization and lifecycle constraints.
    ChallengeCompletion:
      type: object
      required:
      - challengeToken
      properties:
        challengeToken:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          writeOnly: true
      description: Challenge Completion. See the operation descriptions for authorization and lifecycle constraints.
    SessionRevocation:
      type: object
      required:
      - sessionId
      properties:
        sessionId:
          type: string
          format: uuid
      description: Session Revocation. See the operation descriptions for authorization and lifecycle constraints.
    OidcStart:
      type: object
      required:
      - issuer
      - redirectUri
      - purpose
      properties:
        issuer:
          type: string
          format: uri
        redirectUri:
          type: string
          format: uri
        purpose:
          type: string
          enum:
          - Login
          - Link
      description: Oidc Start. See the operation descriptions for authorization and lifecycle constraints.
    OidcRedirect:
      type: object
      required:
      - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
      description: Oidc Redirect. See the operation descriptions for authorization and lifecycle constraints.
    OidcCallback:
      type: object
      required:
      - code
      - state
      properties:
        code:
          type: string
          writeOnly: true
        state:
          type: string
          writeOnly: true
      description: Oidc Callback. See the operation descriptions for authorization and lifecycle constraints.
    Jwks:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
            - kty
            - use
            - alg
            - kid
            - n
            - e
            properties:
              kty:
                type: string
                enum:
                - RSA
              use:
                type: string
                enum:
                - sig
              alg:
                type: string
                enum:
                - RS256
              kid:
                type: string
              n:
                type: string
              e:
                type: string
      description: Jwks. See the operation descriptions for authorization and lifecycle constraints.
    Discovery:
      type: object
      required:
      - issuer
      - jwks_uri
      - token_endpoint
      properties:
        issuer:
          type: string
          format: uri
        jwks_uri:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
      description: Minimum issuer metadata consumed by JWT validators. Optional discovery capabilities may be published
        only when actually supported by the configured issuer; this contract does not advertise an authorization-code
        endpoint or certify a full OpenID Provider.
