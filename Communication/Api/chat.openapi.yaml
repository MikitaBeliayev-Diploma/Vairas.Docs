openapi: 3.1.1
info:
  title: Vairas Chat Backend API
  description: Private school-scoped conversations. PreviewOnlyV1 records consent only. Explicitly enabled ConfirmedLessonActionsV1
    executes exact Administrator-approved practical booking and rescheduling with owner receipts and uncertainty
    recovery. Recorded-evidence queries always report executionAllowed=false; separate Scheduling-only authorization
    binds one command.
  version: 1.0.0
servers:
- url: https://localhost:7800/
