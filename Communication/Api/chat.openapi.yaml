components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadOAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://localhost:7100/connect/token
          scopes:
            identity.validate: Validate current user identity and session
            school.profile-provisioning: Validate invitation or bootstrap evidence
            confirmations.validate: Validate exact human approval
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
      description: Problem. See the operation descriptions for authorization and lifecycle constraints.
    Id:
      type: string
      format: uuid
      description: Id. See the operation descriptions for authorization and lifecycle constraints.
    NullableId:
      type:
      - string
      - 'null'
      format: uuid
      description: Nullable Id. See the operation descriptions for authorization and lifecycle constraints.
    SchoolAuthorityRequest:
      type: object
      required:
      - actorUserId
      - targetUserId
      - schoolId
      - invitationId
      - role
      - bootstrap
      properties:
        actorUserId:
          $ref: '#/components/schemas/Id'
        targetUserId:
          $ref: '#/components/schemas/Id'
        schoolId:
          $ref: '#/components/schemas/Id'
        invitationId:
          $ref: '#/components/schemas/NullableId'
        role:
          type: string
          enum:
          - Teacher
          - Administrator
        bootstrap:
          type: boolean
      description: School Authority Request. See the operation descriptions for authorization and lifecycle constraints.
    ConfirmationRequest:
      type: object
      required:
      - confirmationId
      - identityId
      - operationId
      - requestFingerprint
      - schoolId
      - commandName
      properties:
        confirmationId:
          $ref: '#/components/schemas/Id'
        identityId:
          $ref: '#/components/schemas/Id'
        operationId:
          $ref: '#/components/schemas/Id'
        requestFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        schoolId:
          $ref: '#/components/schemas/NullableId'
        commandName:
          type: string
          enum:
          - CreateUser
          - UpdateUser
          - CreateStudent
          - CreateTeacher
          - CreateAdministrator
      description: Confirmation Request. See the operation descriptions for authorization and lifecycle constraints.
    ChatSession:
      type: object
      required:
      - sessionId
      properties:
        sessionId:
          type: string
          format: uuid
    ChatMessage:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
        schoolId:
          type: string
          format: uuid
    ChatReply:
      type: object
      required:
      - messageId
      - text
      properties:
        messageId: &id002
          type: string
          format: uuid
        text:
          type: string
        previewId: *id002
    HumanApproval:
      type: object
      required:
      - operationId
      - argumentsFingerprint
      - approved
      properties:
        operationId:
          type: string
          format: uuid
        argumentsFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        approved:
          type: boolean
          const: true
    RecordedApproval:
      type: object
      required:
      - confirmationId
      - previewId
      - operationId
      - expiresAt
      properties:
        confirmationId: &id003
          type: string
          format: uuid
        previewId: *id003
        operationId: *id003
        expiresAt:
          type: string
          format: date-time
    AuditList:
      type: array
      items:
        type: object
        required:
        - operationId
        - outcome
        - recordedAt
        properties:
          operationId:
            type: string
            format: uuid
          outcome:
            type: string
            enum:
            - Permitted
            - Rejected
            - Failed
          recordedAt:
            type: string
            format: date-time
