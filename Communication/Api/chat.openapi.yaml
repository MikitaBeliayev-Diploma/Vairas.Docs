              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Business constraints reject the request
                status: 422
                code: BUSINESS_RULE_REJECTED
                correlationId: integration-example-01
        '503':
          description: Authoritative dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Authoritative dependency unavailable
                status: 503
                code: DEPENDENCY_UNAVAILABLE
                correlationId: integration-example-01
      x-traceability:
      - US-018
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id001
          type: string
          format: uuid
        description: Stable operation identity; identical retry reuses the outcome. A different payload with the
          same key is a conflict.
        example: 11111111-1111-4111-8111-111111111111
