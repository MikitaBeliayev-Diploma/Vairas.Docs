asyncapi: 3.0.0
info:
  title: Vairas — User Management Integration Events
  version: 0.1.0
  description: Sender contract implemented by the User Management transactional outbox and Azure Service Bus adapter.
    Delivery is at least once; consumers must deduplicate. Local automated tests verify transactional persistence,
    lease recovery and SDK message metadata. Live broker and subscriber integration is not asserted.
defaultContentType: application/json
channels:
  userDeactivated:
    address: vairas.user.deactivated.v1
    title: UserDeactivated v1
    description: Logical integration event channel.
    messages:
      UserDeactivated:
        $ref: '#/components/messages/UserDeactivated'
operations:
  publishUserDeactivated:
    action: send
    title: Publish UserDeactivated
    channel:
      $ref: '#/channels/userDeactivated'
    messages:
    - $ref: '#/channels/userDeactivated/messages/UserDeactivated'
components:
  schemas:
    IntegrationHeaders:
      type: object
      additionalProperties: false
      description: Application headers only; broker protocol-level delivery headers are transport-specific.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - producer
      - correlationId
      - aggregateId
      - aggregateVersion
      properties:
        eventId: &id002
          type: string
          format: uuid
        eventType: &id001
          type: string
          minLength: 1
        eventVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
          enum:
          - school
          - scheduling
          - vehicle
          - learning
          - documents
          - notifications
          - user
        correlationId: *id001
        causationId: *id001
        aggregateId: *id002
        aggregateVersion:
          type: integer
          minimum: 1
        traceparent: *id001
    UserDeactivatedPayload:
      type: object
      description: User account business status deactivated globally. Does not by itself revoke already-valid sessions;
        enforce authoritative security gates.
      additionalProperties: false
      required:
      - userId
      - deactivatedAt
      properties:
        userId:
          type: string
          format: uuid
        deactivatedAt:
          type: string
          format: date-time
  messages:
    UserDeactivated:
      name: UserDeactivated
      title: UserDeactivated v1
      summary: User account business status deactivated globally. Does not by itself revoke already-valid sessions;
        enforce authoritative security gates.
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/UserDeactivatedPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleUserDeactivated
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: UserDeactivated
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: user
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000007
          aggregateVersion: 3
        payload:
          userId: 10000000-0000-4000-8000-000000000007
          deactivatedAt: '2026-11-15T12:00:00Z'
      x-contract-status: Implemented User Management sender; subscriber implementations and live broker interoperability
        not verified.
