asyncapi: 3.0.0
info:
  title: Vairas — School Management Integration Events
  version: 0.1.0
  description: PROPOSED AsyncAPI 3.0.0 contract for School Management. Events are reliable at-least-once messages;
    see README for exact publishing, ordering, privacy and recovery semantics.
    This is a proposed inter-service payload, not a claim of implemented integration.
defaultContentType: application/json
channels:
  schoolMembershipEnded:
    address: vairas.school.membership-ended.v1
    title: SchoolMembershipEnded v1
    description: Logical integration event channel.
    messages:
      SchoolMembershipEnded:
        $ref: '#/components/messages/SchoolMembershipEnded'
  studentAssignedToGroup:
    address: vairas.school.student-assigned-to-group.v1
    title: StudentAssignedToGroup v1
    description: Logical integration event channel.
    messages:
      StudentAssignedToGroup:
        $ref: '#/components/messages/StudentAssignedToGroup'
  studentEnrollmentCompleted:
    address: vairas.school.enrollment-completed.v1
    title: StudentEnrollmentCompleted v1
    description: Logical integration event channel.
    messages:
      StudentEnrollmentCompleted:
        $ref: '#/components/messages/StudentEnrollmentCompleted'
  studentEnrollmentEnded:
    address: vairas.school.enrollment-ended.v1
    title: StudentEnrollmentEnded v1
    description: Logical integration event channel.
    messages:
      StudentEnrollmentEnded:
        $ref: '#/components/messages/StudentEnrollmentEnded'
  studentEnrollmentStarted:
    address: vairas.school.enrollment-started.v1
    title: StudentEnrollmentStarted v1
    description: Logical integration event channel.
    messages:
      StudentEnrollmentStarted:
        $ref: '#/components/messages/StudentEnrollmentStarted'
  studentRemovedFromGroup:
    address: vairas.school.student-removed-from-group.v1
    title: StudentRemovedFromGroup v1
    description: Logical integration event channel.
    messages:
      StudentRemovedFromGroup:
        $ref: '#/components/messages/StudentRemovedFromGroup'
  teacherAssignedToGroup:
    address: vairas.school.teacher-assigned-to-group.v1
    title: TeacherAssignedToGroup v1
    description: Logical integration event channel.
    messages:
      TeacherAssignedToGroup:
        $ref: '#/components/messages/TeacherAssignedToGroup'
  userDeactivated:
    address: vairas.user.deactivated.v1
    title: UserDeactivated v1
    description: Logical integration event channel.
    messages:
      UserDeactivated:
        $ref: '#/components/messages/UserDeactivated'
operations:
  publishSchoolMembershipEnded:
    action: send
    title: Publish SchoolMembershipEnded
    channel:
      $ref: '#/channels/schoolMembershipEnded'
    messages:
    - $ref: '#/channels/schoolMembershipEnded/messages/SchoolMembershipEnded'
  publishStudentAssignedToGroup:
    action: send
    title: Publish StudentAssignedToGroup
    channel:
      $ref: '#/channels/studentAssignedToGroup'
    messages:
    - $ref: '#/channels/studentAssignedToGroup/messages/StudentAssignedToGroup'
  publishStudentEnrollmentCompleted:
    action: send
    title: Publish StudentEnrollmentCompleted
    channel:
      $ref: '#/channels/studentEnrollmentCompleted'
    messages:
    - $ref: '#/channels/studentEnrollmentCompleted/messages/StudentEnrollmentCompleted'
  publishStudentEnrollmentEnded:
    action: send
    title: Publish StudentEnrollmentEnded
    channel:
      $ref: '#/channels/studentEnrollmentEnded'
    messages:
    - $ref: '#/channels/studentEnrollmentEnded/messages/StudentEnrollmentEnded'
  publishStudentEnrollmentStarted:
    action: send
    title: Publish StudentEnrollmentStarted
    channel:
      $ref: '#/channels/studentEnrollmentStarted'
    messages:
    - $ref: '#/channels/studentEnrollmentStarted/messages/StudentEnrollmentStarted'
  publishStudentRemovedFromGroup:
    action: send
    title: Publish StudentRemovedFromGroup
    channel:
      $ref: '#/channels/studentRemovedFromGroup'
    messages:
    - $ref: '#/channels/studentRemovedFromGroup/messages/StudentRemovedFromGroup'
  publishTeacherAssignedToGroup:
    action: send
    title: Publish TeacherAssignedToGroup
    channel:
      $ref: '#/channels/teacherAssignedToGroup'
    messages:
    - $ref: '#/channels/teacherAssignedToGroup/messages/TeacherAssignedToGroup'
  consumeUserDeactivated:
    action: receive
    title: Consume UserDeactivated
    channel:
      $ref: '#/channels/userDeactivated'
    messages:
    - $ref: '#/channels/userDeactivated/messages/UserDeactivated'
components:
  schemas:
    IntegrationHeaders:
      type: object
      additionalProperties: false
      description: Application headers only; broker protocol-level delivery headers are transport-specific.
      required:
      - eventId
      - eventType
      - eventVersion
      - occurredAt
      - producer
      - correlationId
      - aggregateId
      - aggregateVersion
      properties:
        eventId: &id002
          type: string
          format: uuid
        eventType: &id001
          type: string
          minLength: 1
        eventVersion:
          type: integer
          const: 1
        occurredAt:
          type: string
          format: date-time
        producer:
          type: string
          enum:
          - school
          - scheduling
          - vehicle
          - learning
          - documents
          - notifications
          - user
        correlationId: *id001
        causationId: *id001
        aggregateId: *id002
        aggregateVersion:
          type: integer
          minimum: 1
        traceparent: *id001
    SchoolMembershipEndedPayload:
      type: object
      description: 'User lost school membership. Event-driven caches are advisory: sensitive writes still require
        authoritative permission checks.'
      additionalProperties: false
      required:
      - schoolId
      - membershipId
      - userId
      - role
      - endedAt
      properties:
        schoolId: &id003
          type: string
          format: uuid
        membershipId: *id003
        userId: *id003
        role:
          type: string
          enum:
          - Student
          - Teacher
          - Administrator
        endedAt:
          type: string
          format: date-time
    StudentAssignedToGroupPayload:
      type: object
      description: An enrollment joined a group. EnrollmentId, not StudentId alone, defines the membership.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - groupId
      - effectiveAt
      properties:
        schoolId: &id004
          type: string
          format: uuid
        enrollmentId: *id004
        groupId: *id004
        effectiveAt:
          type: string
          format: date-time
    StudentEnrollmentCompletedPayload:
      type: object
      description: An enrollment has reached Completed, which differs from an early/exceptional end.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - completedAt
      properties:
        schoolId: &id005
          type: string
          format: uuid
        enrollmentId: *id005
        completedAt:
          type: string
          format: date-time
    StudentEnrollmentEndedPayload:
      type: object
      description: An enrollment has ended as withdrawn/transferred/cancelled; affected future lessons require review,
        not silent deletion.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - endReason
      - endedAt
      properties:
        schoolId: &id006
          type: string
          format: uuid
        enrollmentId: *id006
        endReason:
          type: string
          enum:
          - Withdrawn
          - Transferred
          - Cancelled
        endedAt:
          type: string
          format: date-time
    StudentEnrollmentStartedPayload:
      type: object
      description: Enrollment is created and active; Learning may initialize StudentTraining, Scheduling may refresh
        eligibility projection.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - studentId
      - drivingLicenseCategory
      - startedAt
      properties:
        schoolId: &id007
          type: string
          format: uuid
        enrollmentId: *id007
        studentId: *id007
        drivingLicenseCategory:
          type: string
          minLength: 1
        startedAt:
          type: string
          format: date-time
    StudentRemovedFromGroupPayload:
      type: object
      description: An enrollment ceased to belong to a group; consumers must not infer past attendance from current
        membership.
      additionalProperties: false
      required:
      - schoolId
      - enrollmentId
      - groupId
      - effectiveAt
      properties:
        schoolId: &id008
          type: string
          format: uuid
        enrollmentId: *id008
        groupId: *id008
        effectiveAt:
          type: string
          format: date-time
    TeacherAssignedToGroupPayload:
      type: object
      description: A teacher was assigned to a training group; not proof of real-time permission at booking confirmation.
      additionalProperties: false
      required:
      - schoolId
      - groupId
      - teacherId
      - assignedAt
      properties:
        schoolId: &id009
          type: string
          format: uuid
        groupId: *id009
        teacherId: *id009
        assignedAt:
          type: string
          format: date-time
    UserDeactivatedPayload:
      type: object
      description: User account business status deactivated globally. Does not by itself revoke already-valid sessions;
        enforce authoritative security gates.
      additionalProperties: false
      required:
      - userId
      - deactivatedAt
      properties:
        userId:
          type: string
          format: uuid
        deactivatedAt:
          type: string
          format: date-time
  messages:
    SchoolMembershipEnded:
      name: SchoolMembershipEnded
      title: SchoolMembershipEnded v1
      summary: 'User lost school membership. Event-driven caches are advisory: sensitive writes still require authoritative
        permission checks.'
      contentType: application/json
      headers:
        $ref: '#/components/schemas/IntegrationHeaders'
      payload:
        $ref: '#/components/schemas/SchoolMembershipEndedPayload'
      correlationId:
        location: $message.header#/correlationId
      examples:
      - name: sampleSchoolMembershipEnded
        headers:
          eventId: 20000000-0000-4000-8000-000000000001
          eventType: SchoolMembershipEnded
          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: school
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000006
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
          membershipId: 10000000-0000-4000-8000-000000000006
          userId: 10000000-0000-4000-8000-000000000007
          role: Teacher
          endedAt: '2026-11-15T13:00:00Z'
      x-contract-status: Base DDD event; integration payload proposed
    StudentAssignedToGroup:
      name: StudentAssignedToGroup
      title: StudentAssignedToGroup v1
