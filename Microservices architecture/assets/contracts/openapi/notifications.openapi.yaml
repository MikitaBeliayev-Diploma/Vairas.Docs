openapi: 3.1.0
info:
  title: Vairas — Notifications API (PROPOSED)
  version: 0.1.0
  description: Proposed OpenAPI contract; not evidence of implemented endpoints. Tenant/resource authorization is
    mandatory inside the owning service.
security:
- bearerAuth: []
paths:
  /api/v1/schools/{schoolId}/notification-templates:
    get:
      operationId: getNotificationTemplates
      summary: List school-owned templates
      parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationTemplates'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found or not visible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Business conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Business rule rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
  /api/v1/schools/{schoolId}/notifications/{notificationId}:
    get:
      operationId: getNotificationStatus
      summary: View allowed notification delivery state
      parameters:
      - name: schoolId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationStatus'
        '400':
          description: Invalid input
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Access forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Resource not found or not visible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Business conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Business rule rejected
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Dependency unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-to-service token; dedicated audience and workload scope.
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      - correlationId
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
    NotificationTemplates:
      type: array
      items:
        type: object
        required:
        - templateId
        - type
        properties:
          templateId:
            type: string
            format: uuid
          type:
            type: string
    NotificationStatus:
      type: object
      required:
      - notificationId
      - status
      properties:
        notificationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - Pending
          - Sent
          - Failed
          - Cancelled
