          eventVersion: 1
          occurredAt: '2026-11-15T16:00:00Z'
          producer: learning
          correlationId: corr-2026-11-15-001
          aggregateId: 10000000-0000-4000-8000-000000000013
          aggregateVersion: 3
        payload:
          schoolId: 10000000-0000-4000-8000-000000000001
          enrollmentId: 10000000-0000-4000-8000-000000000002
          assessmentId: 10000000-0000-4000-8000-000000000013
          assessedAt: '2026-11-15T13:00:00Z'
      x-contract-status: Base DDD event; integration payload proposed
    LessonCancelled:
      name: LessonCancelled
      title: LessonCancelled v1
